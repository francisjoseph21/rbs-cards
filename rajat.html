<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajat Sharma - RBS International</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --accent-orange: #f97316;
      --accent-blue: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .stripe {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to right, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%);
    }
    .logo-container img {
      width: 140px;
      max-height: 70px;
      object-fit: contain;
      margin-bottom: 15px;
    }
    .profile-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--accent-orange);
      object-fit: cover;
      margin-bottom: 10px;
    }
    .staff-name { font-size: 22px; font-weight: 700; color: #fff; }
    .staff-title { font-size: 13px; color: var(--accent-blue); font-weight: 600; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; color: #fff;
    }
    .btn-call { background: var(--accent-orange); }
    .btn-wa { background: #25D366; }
    .btn-email { background: var(--accent-blue); }
    .company-details {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.8;
    }
    .company-details i { color: var(--accent-blue); width: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="stripe"></div>

    <!-- Company Logo -->
    <div class="logo-container">
      <<img src="RBS%20International%20Transparent.png" alt="RBS International">
    </div>

    <!-- Staff Photo & Personal Information -->
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profile" class="profile-photo">
    <h2 class="staff-name">Rajat Sharma</h2>
    <p class="staff-title">Cheif Executive Officer</p>

    <!-- Interactive Buttons -->
    <div class="btn-group">
      <a href="tel:+919999871862" class="btn btn-call"><i class="fa-solid fa-phone"></i> Call Rajat</a>
      <a href="https://wa.me/919999871862" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
      <a href="mailto:rbsequipments@gmail.com" class="btn btn-email"><i class="fa-solid fa-envelope"></i> Email Rajat</a>
    </div>

    <!-- Shared Office Details -->
    <div class="company-details">
      <div><i class="fa-solid fa-building"></i> RBS International</div>
      <div><i class="fa-solid fa-globe"></i> www.rbsinternational.in</div>
      <div><i class="fa-solid fa-shield-halved"></i> Outdoor, Safety & Rescue Equipment</div>
    </div>
  </div>

</body>
</html>
