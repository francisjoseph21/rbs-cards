<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajat Sharma - RBS International</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-bright: #f8fafc;
      --card-bg: #ffffff;
      --accent-orange: #ea580c;
      --accent-blue: #0284c7;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-bright);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Tricolor Accent Line */
    .stripe {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to right, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%);
    }

    .logo-container img {
      width: 160px;
      max-height: 70px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .profile-photo {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 3px solid var(--accent-orange);
      object-fit: cover;
      margin-bottom: 10px;
    }

    .staff-name { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .staff-title { font-size: 13px; color: var(--accent-blue); font-weight: 700; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 0.8px; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; color: #ffffff;
      transition: transform 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-call { background: var(--accent-orange); }
    .btn-wa { background: #16a34a; }
    .btn-email { background: var(--accent-blue); }

    .company-details {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.8;
    }
    .company-details i { color: var(--accent-blue); width: 20px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="stripe"></div>

    <!-- Company Logo -->
    <div class="logo-container">
  <img src="RBS%20International%20Transparent.png" alt="RBS International">
</div>

    <!-- Staff Photo (Replace the URL below with Rajat's photo link or filename) -->
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profile" class="profile-photo">
    
    <!-- Staff Name & Title -->
    <h2 class="staff-name">Rajat Sharma</h2>
    <p class="staff-title">Chief Executive Officer</p>

    <!-- Action Buttons -->
    <div class="btn-group">
      <a href="tel:+919999871862" class="btn btn-call"><i class="fa-solid fa-phone"></i> Call Rajat</a>
      <a href="https://wa.me/919999871862" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
      <a href="mailto:rajat@rbsinternational.in" class="btn btn-email"><i class="fa-solid fa-envelope"></i> Email Rajat</a>
    </div>

    <!-- Office Details -->
    <div class="company-details">
      <div><i class="fa-solid fa-building"></i> RBS International</div>
      <div><i class="fa-solid fa-globe"></i> www.rbsinternational.in</div>
      <div><i class="fa-solid fa-shield-halved"></i> Outdoor, Safety & Rescue Equipment</div>
    </div>
  </div>

</body>
</html>
